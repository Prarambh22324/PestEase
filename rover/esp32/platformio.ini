; PestEase ESP32 — PlatformIO Configuration
; Alternative to Arduino IDE — use this for better dependency management

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    mikalhart/TinyGPSPlus @ ^1.0.3
    knolleary/PubSubClient @ ^2.8        ; Optional: MQTT instead of HTTP polling

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed  = 921600
